<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
    }

    .hero {
        /* background-image: url(./assets/img/yellow-background-color.png);
    background-position: start;
    background-repeat: no-repeat;
    background-size: 100%; */

        margin: 128px 0 0 0;
        height: 515px;
        width: 100%;
        max-width: 1440px;
        z-index: 0;
        position: relative;
        display: grid;
        overflow: hidden;
        grid-template-areas: "content";

        animation: grow-hero 0.5s ease-in-out forwards;
        animation-delay: 6s;

    }

    @keyframes grow-hero {
        to {
            height: 545px;
        }
    }

    .hero>div {
        grid-area: overlay;

        position: relative;
        grid-area: content;
        width: 100%;
        height: 100%;
        /* Wichtig: Sie müssen die Höhe des Parents annehmen */
        position: relative;
    }

    .hero-layer-text {
        z-index: 6;
        width: 100dvw !important;

        padding-left: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: none;

        transform-origin: center center;
        animation: move-left 1s 4s ease-in-out forwards;
    }

    .hero-layer-text h1 {
        width: 345px;
        color: var(--global-h1-color);
        font-family: "Arima";
        font-size: 60px;
        font-weight: 700;

        text-align: flex-start;

        display: flex;
        overflow: hidden;
        transform: translateY(0%);

        animation: move-h1 1s ease-in-out forwards;
    }

    @keyframes move-h1 {
        0% {
            transform: translateY(100%);
        }

        100% {
            transform: translateY(0%);
        }
    }

    /* 
    @keyframes move-left {
        from {
            transform: translateX(0);
        }

        to {
            transform: translateX(-480px);
        }
    } */


    .hero-layer-text p {
        max-width: 345px;
        width: 50%;

        font-family: "Palanquin";
        font-size: 28px;
        font-weight: 500;
        color: #54370d;


        text-align: flex-start;
        display: flex;


        animation: appear-p 1s ease-in-out forwards;
        animation-delay: 1s;
        opacity: 0;
    }

    @keyframes appear-p {
        0% {
            opacity: 0;
        }

        100% {
            opacity: 1;
        }
    }

    .hero-layer-photo img {
        z-index: 1;
        height: 515px;
        max-width: 1440px;
        width: 100%;

        display: flex;
        opacity: 1;
        position: absolute;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .hero-layer-first-wave img {
        z-index: 3;
        height: 515px;
        width: 942px;

        display: flex;
        opacity: 1;
        position: absolute;
        overflow: hidden;


        animation: first-wave 1s ease-in-out forwards;
        animation-delay: 5.9s;
        transform: scale(1);
        transform-origin: left;
    }

    @keyframes first-wave {
        0% {
            transform: scaleX(1);
            opacity: 1;
        }


        100% {
            transform: scaleX(0);
            opacity: 1;
        }
    }


    .hero-layer-second-wave {
        height: 545px;
        position: absolute;
        bottom: 0;
        right: 0;
    }

    .hero-layer-second-wave img {
        z-index: 4;
        height: 545px;
        width: 647px;
        bottom: 0;
        top: 0;
        display: flex;
        opacity: 1;
        position: absolute;
        overflow: hidden;
        animation: second-wave-in 2s ease-in-out forwards;
        animation-delay: 3s;
        transform: scale(3);
        transform-origin: left;
    }


    @keyframes second-wave-in {
        from {
            transform: scaleX(3);
        }

        to {
            transform: scaleX(1);
        }
    }


    .hero-layer-logo {
        width: 140px;
        height: 140px;
        display: block;
        position: relative;
        z-index: 4;
        left: 25px;
        top: 0px;
        animation: banana 9000ms ease-in infinite;
    }

    .logo-wrapper {
        position: absolute;
        z-index: 4;
        left: 320px;
        bottom: 100px;
        width: 160px;
        height: 160px;
        animation: banana 10s linear infinite;
        transform-origin: center center;
    }

    .flag {
        display: flex;
        left: -70px;
        top: 0px;
        position: relative;
    }

    .hero div.moving {
        position: absolute;
        top: 256px;
        left: 420px;
        width: 180px;
        height: 180px;
        background-color: rgba(78, 164, 135, 1);
        border-radius: 50%;
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        animation: moving-in 1s ease-in-out forwards;
        animation-delay: 5.7s;
    }

    @keyframes moving-in {
        from {
            transform: translateY(100px);

            opacity: 0;
        }

        to {
            transform: translateY(0);
            transform: translateX(0);
            opacity: 1;
        }
    }

    @keyframes banana {

        0%,
        0.03% {
            transform: translateY(0px) rotate(0deg) scaleX(1) scaleY(1);
            animation-timing-function: ease-in;
        }


        25%,
        25.03% {
            transform: translateY(0px) rotate(90deg) scaleX(1) scaleY(1);
            animation-timing-function: ease-in;
        }

        50%,
        50.03% {
            transform: translateY(0px) rotate(180deg) scaleX(1) scaleY(1);
            animation-timing-function: ease-in;
        }


        75%,
        75.03% {
            transform: translateY(0px) rotate(270deg) scaleX(1) scaleY(1);
            animation-timing-function: ease-in;
        }

        100%,
        100.00% {
            transform: translateY(0px) rotate(360deg) scaleX(1) scaleY(1);
        }
    }

    @keyframes moving {
        from {
            transform: translateY(100%);
            opacity: 0;
        }

        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    .yellow-card-mobil {
        display: none;
    }

    .yellow-card-mobil-groß {
        display: none;
    }



    @media screen and (min-width:320px) and (max-width:480px) {
        .hero {
            animation: none;

            height: 533px;
            width: 100%;
        }

        .hero-layer-text {
            padding: 0 0 0 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            overflow: hidden;

            animation: text-weg 1s forwards;
            animation-delay: 2s;
        }

        .hero-layer-text h1 {
            animation: none;
            width: 261px;
            height: 43px;
            font-size: 40px;

            display: flex;
            overflow: hidden;
            transform: translateY(0%);
        }

        .hero-layer-text p {
            animation: none;
            width: 261px;
            height: 101px;
            font-size: 20px;
            opacity: 1;

            text-align: flex-start;
            display: flex;
        }

        @keyframes text-weg {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        .yellow-card img {
            display: none;
        }

        .hero-layer-photo img {
            display: flex;
            z-index: -1;
            height: 515px;

            opacity: 1;
            position: absolute;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transform-origin: top right;
            animation: photo-slide 1s forwards;
            animation-delay: 0;
        }


        @keyframes photo-slide {
            from {
                transform: translateX(0%);
            }

            to {
                transform: translateX(-46%);
            }
        }

        .hero-layer-first-wave img {
            display: none;
        }

        .hero-layer-second-wave img {
            display: none;
        }

        .yellow-card-mobil {
            display: flex;
        }

        .yellow-card-mobil img {
            height: 299px;
            width: 222px;
            z-index: 0;
            top: 0;
            left: 0;
            transform: scale(5);
            transform-origin: top left;
            animation: verkleinern 1s forwards;
        }

        .yellow-card-mobil-groß {
            display: flex;
            top: 0;
            left: 0;
        }

        .yellow-card-mobil-groß img {
            height: 482px;
            width: 375px;
            z-index: 1;
            animation: wave-weg 1s forwards;
            animation-delay: 3s;
            transform-origin: top left;
        }

        @keyframes wave-weg {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(0);
            }
        }

        @keyframes verkleinern {
            from {
                transform: scale(5);
            }

            to {
                transform: scale(1);
            }

        }

        .hero div.moving {
            position: absolute;
            top: 121px;
            left: 71px;
            width: 180px;
            height: 180px;
            background-color: rgba(78, 164, 135, 1);
            border-radius: 50%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: tada 1s ease-in-out forwards;
            animation-delay: 5.7s;
        }

        @keyframes tada {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    }

    @media screen and (max-width:1440px) {

        @keyframes move-left {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-480px);
            }
        }
    }

    @media screen and (min-width:1340px) and (max-width:1439px) {
        .hero-layer-text {
            transform-origin: center center;
            animation: move-left 1s 4s ease-in-out forwards;
        }

        @keyframes move-left {
            from {
                transform: translateX(0%);
            }

            to {
                transform: translateX(-33%);
            }
        }
    }

       @media screen and (min-width:1140px) and (max-width:1339px) {
        .hero-layer-text {
            transform-origin: center center;
            animation: move-left 1s 4s ease-in-out forwards;
        }

        @keyframes move-left {
            from {
                transform: translateX(0%);
            }

            to {
                transform: translateX(-30%);
            }
        }
    }


       @media screen and (min-width:940px) and (max-width:1139px) {
        .hero-layer-text {
            transform-origin: center center;
            animation: move-left 1s 4s ease-in-out forwards;
        }

        @keyframes move-left {
            from {
                transform: translateX(0%);
            }

            to {
                transform: translateX(-27%);
            }
        }
    }

       @media screen and (min-width:840px) and (max-width:939px) {
        .hero-layer-text {
            transform-origin: center center;
            animation: move-left 1s 4s ease-in-out forwards;
        }

        @keyframes move-left {
            from {
                transform: translateX(0%);
            }

            to {
                transform: translateX(-25%);
            }
        }
    }

       @media screen and (min-width:740px) and (max-width:839px) {
        .hero-layer-text {
            transform-origin: center center;
            animation: move-left 1s 4s ease-in-out forwards;
        }

        @keyframes move-left {
            from {
                transform: translateX(0%);
            }

            to {
                transform: translateX(-20%);
            }
        }
    }
</style>

<body>
    <section class="hero">
        <div class="hero-layer-text">
            <h1>Cappadocia</h1>
            <p>From sunrise balloons to hidden cave dwellings, every moment feels unreal in the best way.</p>
        </div>
        <div class="yellow-card-mobil">
            <img src="assets/img/mobil-yellow-wave-small.png" alt="Gelber Hintergrund für 320px">
        </div>
        <div class="yellow-card-mobil-groß">
            <img src="assets/img/mobil-yellow-wave-big.png" alt="Big yellow wave">
        </div>
        <div class="yellow-card">
            <img src="assets/img/yellow-background-color.png" alt="Gelber Hintergrund">
        </div>
        <div class="hero-layer-photo">
            <img src="assets/img/hero-Ballons.svg" alt="Pärchen beim Kaffee im Intergrund Ballons">
        </div>
        <div class="hero-layer-first-wave">
            <img src="assets/img/yellow-first-wave.png" alt="Grafik einer gelben Welle">
        </div>
        <div class="hero-layer-second-wave">
            <img src="assets/img/yellow-second-wave.png" alt="Grafik einer gelben Welle klein">
        </div>
        <div class="moving">
            <img class="hero-layer-logo" src="assets/icons/Cappadocia . Turkey ..svg"
                alt="Schriftzug Cappadocia und Türkei">
            <img class="flag" src="assets/icons/Flag_orb_Turkey 2.svg" alt="Flagge der Türkei">
        </div>
    </section>
</body>

</html>
